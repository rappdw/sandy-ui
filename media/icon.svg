<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sandbox container: rounded rectangle with a small "tab" notch
       suggesting a window or container header. -->
  <rect x="3" y="4" width="18" height="16" rx="2.5"/>
  <line x1="3" y1="8" x2="21" y2="8"/>
  <!-- Window dots (subtle, suggesting a contained app) -->
  <circle cx="6" cy="6" r="0.5" fill="currentColor"/>
  <circle cx="8" cy="6" r="0.5" fill="currentColor"/>
  <circle cx="10" cy="6" r="0.5" fill="currentColor"/>
  <!-- Terminal prompt inside: chevron + cursor -->
  <polyline points="7,12 10,14 7,16"/>
  <line x1="12" y1="16" x2="17" y2="16"/>
</svg>
