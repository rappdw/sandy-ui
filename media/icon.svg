<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sun (filled circle, sits above horizon). currentColor adapts to the
       active VSCode theme. -->
  <circle cx="12" cy="7" r="3" stroke="none"/>
  <!-- Horizon: single wavy water line. Stroke-only so the sun + dunes
       read as the dominant masses. -->
  <path d="M2 13 Q 5 11.5, 8 13 T 14 13 T 20 13 T 22 13" fill="none"/>
  <!-- Sand dunes (filled bottom): two soft mounds. -->
  <path d="M2 19 Q 7 16, 12 18 T 22 18 L 22 22 L 2 22 Z" stroke="none"/>
</svg>
