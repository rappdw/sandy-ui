version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
      xterm:
        patterns:
          - "@xterm/*"
      build-tooling:
        patterns:
          - "typescript"
          - "@vscode/vsce"
          - "@electron/rebuild"
          - "electron"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
