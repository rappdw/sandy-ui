name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      # Integration tests need a display server on Linux; xvfb-run wraps the cmd.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - if: runner.os != 'Linux'
        run: npm run test:integration

